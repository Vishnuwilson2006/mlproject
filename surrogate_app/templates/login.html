{% extends 'base.html' %}

{% block title %}User Login | ECE ML Surrogate{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="glass-card p-4">
                <div class="text-center mb-4">
                    <div class="kpi-icon bg-primary bg-opacity-25 text-primary mx-auto mb-3">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="text-white fw-bold">Sign In to CircuitAI</h3>
                    <p class="text-secondary small">Access your saved predictions and custom history</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="id_username">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" required placeholder="Enter your username">
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="id_password">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required placeholder="Enter password">
                    </div>

                    <button type="submit" class="btn btn-gradient w-100 py-2 font-weight-bold">
                        Sign In
                    </button>
                </form>

                <div class="mt-4 pt-3 text-center border-top border-secondary border-opacity-25">
                    <span class="text-secondary small">Don't have an account?</span>
                    <a href="{% url 'register' %}" class="text-primary small fw-bold text-decoration-none ms-1">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
